{% extends 'base.html' %}
{% block title %}Erro {{ code }}{% endblock %}
{% block breadcrumb %}Não foi possível continuar{% endblock %}
{% block content %}<div class="error-state"><span>🌿</span><strong>{{ code }}</strong><h1>Ops! Encontramos um obstáculo.</h1><p>{{ message }}</p><a class="btn btn-primary" href="{{ url_for('home') }}">Voltar ao início</a></div>{% endblock %}
